<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>VoxText – Variant B (Studio) Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#1a1a1a; font-family: Geist, sans-serif; color:#fff; }
  .label { padding:12px 24px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#9a9a9a; font-family:"Geist Mono", monospace; }
  .frame { display:flex; justify-content:center; margin-bottom:24px; }
  .scaler { transform-origin: top center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="label">Screen 1 — Upload</div>
<div class="frame"><div id="upload" class="scaler"></div></div>
<div class="label">Screen 2 — Transcript</div>
<div class="frame"><div id="transcript" class="scaler"></div></div>

<script type="text/babel" src="variant-b-studio.jsx"></script>
<script type="text/babel">
  // Fit-to-width scaler
  const fit = (id, comp) => {
    const el = document.getElementById(id);
    ReactDOM.createRoot(el).render(React.createElement(comp));
    const apply = () => {
      const s = Math.min(1, (window.innerWidth - 40) / 1280);
      el.style.transform = `scale(${s})`;
      el.style.width = '1280px';
      el.style.height = (820 * s) + 'px';
      el.style.overflow = 'hidden';
    };
    apply();
    window.addEventListener('resize', apply);
  };
  fit('upload', VariantB_Upload);
  fit('transcript', VariantB_Transcript);
</script>
</body>
</html>
